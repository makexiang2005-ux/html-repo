<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
<img src="images/crash.png" id="myAudio1">
<img src="images/kick.png" id="myAudio2">
<img src="images/snare.png" id="myAudio3">
<img src="images/tom1.png" id="myAudio4">
<img src="images/tom2.png" id="myAudio5">
<img src="images/tom3.png" id="myAudio6">
<img src="images/tom4.png" id="myAudio7">



<script>
 let crash = document.getElementById("myAudio1");
 crash.addEventListener('click',playCrash);

 function playCrash(){
    let crash = new Audio("sounds/crash.mp3");
    crash.play();
 }
  
 let kick = document.getElementById("myAudio2");
 kick.addEventListener('click',playKick);

 function playKick(){
    let kick = new Audio("sounds/kick-bass.mp3");
    kick.play();
 }

  let snare = document.getElementById("myAudio3");
 snare.addEventListener('click',playSnare);

 function playSnare(){
    let snare = new Audio("sounds/snare.mp3");
    snare.play();
 }
 let tom1 = document.getElementById("myAudio4");
 tom1.addEventListener('click',playTom1);

 function playTom1(){
    let tom1 = new Audio("sounds/tom-1.mp3");
    tom1.play();
 }

  let tom2 = document.getElementById("myAudio5");
 tom2.addEventListener('click',playTom2);

 function playTom2(){
    let tom2 = new Audio("sounds/tom-2.mp3");
    tom2.play();
 }

  let tom3 = document.getElementById("myAudio6");
 tom3.addEventListener('click',playTom3);

 function playTom3(){
    let tom3 = new Audio("sounds/tom-3.mp3");
    tom3.play();
 }

  let tom4 = document.getElementById("myAudio7");
 tom4.addEventListener('click',playTom4);

 function playTom4(){
    let tom4 = new Audio("sounds/tom-4.mp3");
    tom4.play();
 }
</script>
</body>
</html>
